apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: team-a-app-pdb
  namespace: team-a
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: team-a-app
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: team-b-app-pdb
  namespace: team-b
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: team-b-app
