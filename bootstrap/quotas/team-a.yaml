apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-a-quota
  namespace: team-a
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    pods: "20"
    services: "10"
    replicationcontrollers: "20"
    resourcequotas: "1"
    services.loadbalancers: "2"
    services.nodeports: "0"
    configmaps: "50"
    secrets: "50"
    persistentvolumeclaims: "10"
    requests.storage: "100Gi"
