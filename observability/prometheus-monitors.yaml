apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: team-a-monitor
  namespace: team-a
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: team-a-app
  namespaceSelector:
    matchNames:
    - team-a
  endpoints:
  - port: http
    interval: 30s
    path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: team-b-monitor
  namespace: team-b
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: team-b-app
  namespaceSelector:
    matchNames:
    - team-b
  endpoints:
  - port: http
    interval: 30s
    path: /metrics
