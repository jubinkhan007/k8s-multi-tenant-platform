apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: team-a
spec:
  metrics:
  - name: success-rate
    interval: 1m
    successCondition: result[0] >= 0.95
    failureLimit: 3
    provider:
      prometheus:
        address: http://prometheus.istio-system:9090
        query: |
          sum(irate(istio_requests_total{reporter="source",destination_service_namespace="team-a",response_code!~"5.*"}[1m])) / 
          sum(irate(istio_requests_total{reporter="source",destination_service_namespace="team-a"}[1m]))
